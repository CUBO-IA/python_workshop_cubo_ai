<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Coffee-bit{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="site-header">
        <nav class="navbar">
            <a href="{{ url_for('index') }}" class="brand">
                Coffee-bit
            </a>

            <div class="nav-links">
                <a href="{{ url_for('index') }}">Catálogo</a>
                <a href="{{ url_for('cart') }}" class="cart-link">
                    Carrito
                    {% if cart_count is defined and cart_count > 0 %}
                        <span class="cart-count">{{ cart_count }}</span>
                    {% endif %}
                </a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; {{ current_year if current_year is defined else '' }} Coffee-bit</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
